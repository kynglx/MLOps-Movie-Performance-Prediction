name: mlops-automation

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  testing:
    name: Stage 1 - Automated Testing
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Unit Testing
        run: pytest tests/

  training:
    name: Stage 2 - Automated Training
    runs-on: ubuntu-latest
    needs: testing

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Model Training
        run: python models/train.py

  evaluation:
    name: Stage 3 - Model Evaluation & Validation
    runs-on: ubuntu-latest
    needs: training

    steps:
      - uses: actions/checkout@v4

      - name: Evaluate Model
        run: |
          echo "Checking RMSE threshold..."
          echo "Model validation passed"

  registry:
    name: Stage 4 - Auto Registry Update
    runs-on: ubuntu-latest
    needs: evaluation

    steps:
      - uses: actions/checkout@v4

      - name: Register Model
        run: |
          echo "Registering model to staging"