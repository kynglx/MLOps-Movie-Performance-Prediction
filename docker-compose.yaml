services:

  mlflow-server:
    image: ghcr.io/mlflow/mlflow:v3.1.0
    container_name: mlflow-server

    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlflow.db
      --default-artifact-root /mlruns

    ports:
      - "5000:5000"

    volumes:
      - ./mlruns:/mlruns
      - ./mlflow.db:/mlflow.db

    networks:
      - movie-network

  movie-app:
    build: .
    container_name: movie-app

    ports:
      - "8000:8000"

    depends_on:
      - mlflow-server

    environment:
      - MLFLOW_TRACKING_URI=http://mlflow-server:5000

    networks:
      - movie-network

  movie-model:
    image: movie-model

    depends_on:
      - mlflow-server

    networks:
      - movie-network

  prometheus:
    image: prom/prometheus
    container_name: prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./monitoring/prometheus.yaml:/etc/prometheus/prometheus.yaml

    networks:
      - movie-network

  grafana:
    image: grafana/grafana-oss
    container_name: grafana

    ports:
      - "3000:3000"

    networks:
      - movie-network

networks:
  movie-network:
    driver: bridge