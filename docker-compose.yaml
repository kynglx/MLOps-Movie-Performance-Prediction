services:

  mlflow-server:
    image: ghcr.io/mlflow/mlflow:v3.1.0
    container_name: mlflow-server

    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri file:/mlruns
      --default-artifact-root /mlruns

    ports:
      - "5000:5000"

    volumes:
      - ./mlruns:/mlruns

    networks:
      - movie-network

  movie-app:
    build: .

    expose:
    - "8000"

    depends_on:
      - mlflow-server

    environment:
      - MLFLOW_TRACKING_URI=http://mlflow-server:5000

    networks:
      - movie-network


  prometheus:
    image: prom/prometheus
    container_name: prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml

    networks:
      - movie-network

  grafana:
    image: grafana/grafana-oss
    container_name: grafana

    ports:
      - "3000:3000"

    networks:
      - movie-network

  nginx:
    image: nginx:latest
    container_name: nginx

    ports:
      - "8000:80"

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf

    depends_on:
      - movie-app

    networks:
      - movie-network

networks:
  movie-network:
    driver: bridge